# Point MoveIt2's trajectory execution at the bridge node's action server.
# Reference this file from your moveit_config package's moveit_controllers.yaml
# (or merge these keys into the one generated by MoveIt Setup Assistant).
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

controller_names:
  - arm_controller

arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6
